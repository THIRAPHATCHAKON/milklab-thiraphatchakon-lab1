name: Keep HuggingFace Space Alive

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping HuggingFace Space
        env:
          HF_SPACE_URL: ${{ vars.HF_SPACE_URL || 'https://huggingface.co/spaces/Thiraphatchakon/solarplus-rag' }}
        run: |
          curl -L --max-time 60 -s -o /dev/null -w "%{http_code}\n" "$HF_SPACE_URL"